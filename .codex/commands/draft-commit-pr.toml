description = "Draft a Conventional Commit message and PR markdown from staged changes (text only, does not commit or push)"
prompt = "Optional hint: {{args}}. Inspect only STAGED changes (run `git diff --staged --stat` then `git diff --staged`). If nothing is staged, say 'No staged changes.' and stop. 1) Commit message using Conventional Commits: <type>[optional scope]: <description> where type is one of feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert; scope is optional and derived from the touched area; description is imperative mood, lowercase, <=72 chars, no trailing period; single-line subject only, do NOT add a body. 2) PR markdown with three sections: '## Summary' (1-3 sentences on why), '## Changes' (one bullet per meaningful change), '## Related' (issue/PR refs, or 'None'). If a hint is provided, use it to bias the type/scope/description. Output the commit message and the PR markdown in separate fenced blocks. Do NOT run git commit, git push, or create a PR — output text only."
